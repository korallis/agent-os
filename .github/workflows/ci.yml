name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        # Version comes from the root package.json "packageManager" field.

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Runtime deps for fleet gates (real tmux + git)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux
          tmux -V
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version
          git config --global user.email "ci@agent-os.local"
          git config --global user.name "Agent OS CI"
          git config --global init.defaultBranch main

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint (workspaces — no-explicit-any enforced)
        run: pnpm run lint

      - name: Lint (root scripts + gates)
        run: pnpm exec eslint scripts tooling

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Zero-deprecated gate
        run: node scripts/verify-no-deprecated.mjs

      - name: Phase 1 gates
        run: node tooling/gates/phase-1.mjs

      - name: Phase 2 gates
        run: node tooling/gates/phase-2.mjs

      - name: Phase 3 gates
        run: node tooling/gates/phase-3.mjs

      - name: Phase 4 gates
        run: node tooling/gates/phase-4.mjs

      - name: Phase 5 gates
        run: node tooling/gates/phase-5.mjs

      - name: Install Playwright chromium (Phase 6 browser gates)
        run: pnpm exec playwright install --with-deps chromium

      - name: Phase 6 gates
        run: node tooling/gates/phase-6.mjs

      - name: Phase 9 gates
        run: node tooling/gates/phase-9.mjs

      - name: Phase 10 gates
        run: node tooling/gates/phase-10.mjs
